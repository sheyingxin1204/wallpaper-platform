name: Deploy

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "正式站点 URL（例如 https://wallpapers.example.com），构建时内联到 sitemap/OpenGraph"
        required: true
        type: string
      keep_vars:
        description: "Keep Worker dashboard variables and secrets"
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy to Cloudflare
        run: pnpm run cf:deploy -- ${{ inputs.keep_vars == true && '--keep-vars' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
